<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Counter App</title>
    <link rel="stylesheet" href="../CSS/style.css" />
  </head>
  <body>
    <div class="counter-container">
      <h1 class="counter-heading">Counter App</h1>
      <p id="counterDisplay">0</p>
      <div class="btn-container">
        <button class="button" id="incrementBtn">Increment</button>
        <button class="button" id="decrementBtn">Decrement</button>
        <button class="button" id="resetBtn">Reset</button>
      </div>
    </div>

    <script src="../JavaScript/script.js" defer></script>
  </body>
</html>
